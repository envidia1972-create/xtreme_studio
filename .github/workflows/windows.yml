name: Windows build

# Compila el .exe de Windows en la nube. Sirve cuando no hay una PC Windows a
# mano: GitHub ejecuta el build y deja la carpeta Release como artifact.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: FFmpeg (GPL, win64)
        shell: pwsh
        run: |
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg -Force
          $exe = Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force tools | Out-Null
          Copy-Item $exe.FullName tools\ffmpeg.exe
          $play = Get-ChildItem ffmpeg -Recurse -Filter ffplay.exe | Select-Object -First 1
          if ($play) {
            Copy-Item $play.FullName tools\ffplay.exe
            Write-Host "[ok] ffplay para cue: $($play.FullName)"
          }
          else {
            Write-Host '[aviso] La build de FFmpeg no trae ffplay.exe.' -ForegroundColor Yellow
          }
          & tools\ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: Dependencias Dart
        shell: pwsh
        run: flutter pub get

      - name: Comprobar entorno
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tool/check_toolchain.ps1

      - name: Pruebas del nucleo (Windows)
        run: dart run tool/verify_core.dart

      - name: Pruebas del soundboard
        run: dart run tool/verify_soundboard.dart

      - name: Pruebas de actualizaciones
        run: dart run tool/verify_update.dart

      - name: Compilar
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tool/build_windows.ps1

      - name: Publicar artifact
        uses: actions/upload-artifact@v4
        with:
          name: xtreme_studio-windows-x64
          path: build/windows/x64/runner/Release
          if-no-files-found: error

      - name: Preparar release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $match = Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)'
          if (-not $match) { throw 'No se encontro la version en pubspec.yaml' }
          $version = $match.Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "El tag ${{ github.ref_name }} no coincide con pubspec ($version). Actualiza pubspec.yaml antes de publicar."
          }
          $release = 'build/windows/x64/runner/Release'
          $zip = "XtremeStudio-$version-windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$release\*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii checksums.txt
          "ZIP=$zip" >> $env:GITHUB_ENV
          Write-Host "[ok] $zip ($hash)"

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Xtreme Studio ${{ github.ref_name }}
          files: |
            ${{ env.ZIP }}
            checksums.txt
          generate_release_notes: true
