name: Release build

# Compila Windows y Linux en la nube. En un tag v* publica ambos paquetes en
# la misma release. En workflow_dispatch solo deja los artifacts.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: FFmpeg (GPL, win64)
        shell: pwsh
        run: |
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg -Force
          $exe = Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force tools | Out-Null
          Copy-Item $exe.FullName tools\ffmpeg.exe
          $play = Get-ChildItem ffmpeg -Recurse -Filter ffplay.exe | Select-Object -First 1
          if ($play) {
            Copy-Item $play.FullName tools\ffplay.exe
            Write-Host "[ok] ffplay para cue: $($play.FullName)"
          }
          else {
            Write-Host '[aviso] La build de FFmpeg no trae ffplay.exe.' -ForegroundColor Yellow
          }
          & tools\ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: Dependencias Dart
        shell: pwsh
        run: flutter pub get

      - name: Comprobar entorno
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tool/check_toolchain.ps1

      - name: Pruebas del nucleo (Windows)
        run: dart run tool/verify_core.dart

      - name: Pruebas del soundboard
        run: dart run tool/verify_soundboard.dart

      - name: Pruebas de actualizaciones
        run: dart run tool/verify_update.dart

      - name: Compilar
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tool/build_windows.ps1

      - name: Publicar artifact Windows
        uses: actions/upload-artifact@v4
        with:
          name: xtreme_studio-windows-x64
          path: build/windows/x64/runner/Release
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Dependencias Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libasound2-dev libpulse-dev

      - name: FFmpeg (GPL, linux64)
        run: |
          url='https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz'
          curl -fL "$url" -o ffmpeg.tar.xz
          mkdir -p ffmpeg
          tar -xJf ffmpeg.tar.xz -C ffmpeg --strip-components=1
          exe="$(find ffmpeg -type f -name ffmpeg | head -n1)"
          test -n "$exe"
          mkdir -p tools
          cp "$exe" tools/ffmpeg
          chmod +x tools/ffmpeg
          license="$(find ffmpeg -maxdepth 2 -type f -iname 'LICENSE*' | head -n1)"
          if [ -n "$license" ]; then cp "$license" tools/ffmpeg.LICENSE; fi
          tools/ffmpeg -hide_banner -version | head -n1

      - name: Dependencias Dart
        run: flutter pub get

      - name: Pruebas de actualizaciones
        run: dart run tool/verify_update.dart

      - name: Actualizador Linux (prueba real)
        run: dart run tool/verify_linux_updater.dart

      - name: Pruebas de donaciones
        run: flutter test test/donation_test.dart

      - name: Compilar
        run: tool/build_linux.sh

      - name: Empaquetar Linux
        id: package
        run: |
          version="$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -n1)"
          test -n "$version"
          name="XtremeStudio-$version-linux-x64.tar.gz"
          tar -C build/linux/x64/release -czf "$name" bundle
          sha256sum "$name" > checksums-linux.txt
          echo "NAME=$name" >> "$GITHUB_ENV"
          echo "[ok] $name"
          cat checksums-linux.txt

      - name: Publicar artifact Linux
        uses: actions/upload-artifact@v4
        with:
          name: xtreme_studio-linux-x64
          path: |
            ${{ env.NAME }}
            checksums-linux.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: xtreme_studio-*
          path: dist

      - name: Preparar assets
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -n1)"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "El tag ${GITHUB_REF_NAME} no coincide con pubspec ($version)." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

          mkdir -p out
          (
            cd dist/xtreme_studio-windows-x64
            zip -qr "$GITHUB_WORKSPACE/out/XtremeStudio-$version-windows-x64.zip" .
          )

          linux_tar="$(find dist/xtreme_studio-linux-x64 -maxdepth 1 -name '*.tar.gz' | head -n1)"
          test -n "$linux_tar"
          cp "$linux_tar" "out/XtremeStudio-$version-linux-x64.tar.gz"

          (
            cd out
            sha256sum XtremeStudio-* > checksums.txt
            cat checksums.txt
          )

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Xtreme Studio ${{ github.ref_name }}
          files: |
            out/XtremeStudio-${{ env.VERSION }}-windows-x64.zip
            out/XtremeStudio-${{ env.VERSION }}-linux-x64.tar.gz
            out/checksums.txt
          generate_release_notes: true
